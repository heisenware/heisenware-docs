<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font setup for recordings only (lib.js hands it to Chromium via
  FONTCONFIG_FILE). The platform's UI is Roboto; where a page falls back to
  the system font, prefer Roboto over the box's default so that screenshots
  look like a desktop rather than a bare server.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
