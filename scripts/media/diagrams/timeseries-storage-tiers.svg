<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Inter, Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #f3f6f9; stroke: #d7e0e8; stroke-width: 1.5; }
    .raw { fill: #e8f3ee; stroke: #2e7d63; stroke-width: 1.5; }
    .agg { fill: #eef2fa; stroke: #5a7fb0; stroke-width: 1.5; }
    .title { font-size: 17px; font-weight: 700; fill: #22303c; }
    .bucket { font-size: 19px; font-weight: 700; font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #22303c; }
    .txt { font-size: 13px; fill: #4a5b6a; }
    .note { font-size: 13px; fill: #6b7c8c; }
    .step { font-size: 12px; fill: #41628d; }
    .arrow { stroke: #8da0b3; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#8da0b3"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="968" height="328" rx="12" class="frame"/>
  <text x="38" y="46" class="title">The storage tiers: one write, six resolutions</text>

  <!-- the write enters the raw bucket -->
  <text x="38" y="106" class="txt">Every write</text>
  <text x="38" y="124" class="txt">lands here</text>
  <path d="M110,116 L148,116" class="arrow" marker-end="url(#a)"/>

  <!-- H+ raw -->
  <rect x="152" y="80" width="124" height="88" rx="9" class="raw"/>
  <text x="172" y="112" class="bucket">H+</text>
  <text x="172" y="134" class="txt">raw, every point</text>
  <text x="172" y="153" class="txt">kept 1 day</text>

  <!-- the chain -->
  <text x="292" y="104" class="step">every 5 m</text>
  <path d="M276,124 L360,124" class="arrow" marker-end="url(#a)"/>
  <rect x="364" y="80" width="124" height="88" rx="9" class="agg"/>
  <text x="384" y="112" class="bucket">D+</text>
  <text x="384" y="134" class="txt">5 minutes</text>
  <text x="384" y="153" class="txt">kept 1 week</text>

  <text x="508" y="104" class="step">every 1 h</text>
  <path d="M488,124 L572,124" class="arrow" marker-end="url(#a)"/>
  <rect x="576" y="80" width="124" height="88" rx="9" class="agg"/>
  <text x="596" y="112" class="bucket">W+</text>
  <text x="596" y="134" class="txt">1 hour</text>
  <text x="596" y="153" class="txt">kept 1 week</text>

  <text x="720" y="104" class="step">every 1 d</text>
  <path d="M700,124 L784,124" class="arrow" marker-end="url(#a)"/>
  <rect x="788" y="80" width="124" height="88" rx="9" class="agg"/>
  <text x="808" y="112" class="bucket">M+</text>
  <text x="808" y="134" class="txt">1 day</text>
  <text x="808" y="153" class="txt">kept 1 month</text>

  <!-- wraps to the second row -->
  <path d="M850,168 L850,196 L700,196 L700,222" class="arrow" marker-end="url(#a)"/>
  <text x="712" y="192" class="step">every 7 d</text>

  <rect x="638" y="226" width="124" height="88" rx="9" class="agg"/>
  <text x="658" y="258" class="bucket">Y+</text>
  <text x="658" y="280" class="txt">7 days</text>
  <text x="658" y="299" class="txt">kept 1 year</text>

  <text x="782" y="250" class="step">every 1 mo</text>
  <path d="M762,270 L846,270" class="arrow" marker-end="url(#a)"/>
  <rect x="850" y="226" width="124" height="88" rx="9" class="agg"/>
  <text x="870" y="258" class="bucket">F+</text>
  <text x="870" y="280" class="txt">1 month</text>
  <text x="870" y="299" class="txt">kept forever</text>

  <text x="38" y="248" class="note">Each step keeps the mean, the minimum,</text>
  <text x="38" y="268" class="note">the maximum and the count of its window.</text>
  <text x="38" y="298" class="note">A read picks the finest tier that still</text>
  <text x="38" y="318" class="note">holds the range asked for.</text>
</svg>
